# Entorno de desarrollo NeoSTP (M8.1): SQL Server + Api + Web + Worker.
#   docker compose up -d --build
# Secretos reales NO van aquí: usa un archivo .env (gitignored) o variables del host.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Your_strong!Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - neostp-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/NeoSTP.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NeoStpDb: "Server=db;Database=NeoSTP_Cloud;User Id=sa;Password=${SA_PASSWORD:-Your_strong!Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Key: "${JWT_KEY:-dev-only-replace-me-with-a-strong-32-plus-char-secret-key}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/NeoSTP.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NeoStpDb: "Server=db;Database=NeoSTP_Cloud;User Id=sa;Password=${SA_PASSWORD:-Your_strong!Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/NeoSTP.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__NeoStpDb: "Server=db;Database=NeoSTP_Cloud;User Id=sa;Password=${SA_PASSWORD:-Your_strong!Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=True"
    depends_on:
      db:
        condition: service_healthy

volumes:
  neostp-sql:
