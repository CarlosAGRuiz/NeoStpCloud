name: CI

# Build + test en cada push/PR a main (M5.3). Usa toggles Mock; no requiere BD ni
# secretos (los tests corren con EF Core InMemory y HTTP simulado).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NeoSTP.slnx

      - name: Build
        run: dotnet build NeoSTP.slnx -c Release --no-restore

      - name: Test (unit + integración)
        run: dotnet test NeoSTP.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Publicar cobertura como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage/**/coverage.cobertura.xml
          retention-days: 30
